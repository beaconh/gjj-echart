name: Sync Supabase data

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download repayments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          auth=()
          [[ "$SUPABASE_PUBLISHABLE_KEY" == eyJ* ]] && auth=(-H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/repayments?select=*&order=row_index.desc" \
            --output /tmp/repayments.json
          jq -e 'type == "array"' /tmp/repayments.json >/dev/null
          jq . /tmp/repayments.json > assets/data.json

      - name: Commit updated local data
        run: |
          git diff --quiet -- assets/data.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data.json
          git commit -m 'chore: sync repayments from Supabase'
          git push
